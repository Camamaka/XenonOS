set default=0
set timeout=30

loadfont unicode
set menu_color_normal=cyan/black
set menu_color_highlight=black/cyan

menuentry "XenonOS  -  Kur: GNOME masaustu (Ubuntu gibi)" {
    set gfxpayload=keep
    linux /casper/vmlinuz xenonde=gnome ---
    initrd /casper/initrd
}

menuentry "XenonOS  -  Kur: KDE Plasma masaustu" {
    set gfxpayload=keep
    linux /casper/vmlinuz xenonde=kde ---
    initrd /casper/initrd
}

menuentry "XenonOS  -  Install: XFCE desktop (lightweight)" {
    set gfxpayload=keep
    linux /casper/vmlinuz xenonde=xfce ---
    initrd /casper/initrd
}

menuentry "XenonOS  -  Terminal only (no desktop)" {
    set gfxpayload=keep
    linux /casper/vmlinuz xenonde=none ---
    initrd /casper/initrd
}